[project]
name = "personal-ai-agent-api"
version = "0.1.0"
description = "FastAPI backend for the Personal AI Agent Platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-include = ["../../migrations/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",   # assert is how pytest checks things
  "UP038",  # isinstance(x, (A, B)) is clearer and faster than A | B
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # hard-coded test passwords are intentional

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["rq.*", "argon2.*"]
ignore_missing_imports = true
